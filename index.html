<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>backdrop</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #stage { position: absolute; background: center / 100% 100% no-repeat; } /* plate image set by main.js */
      #stage canvas { display: block; width: 100%; height: 100%; }
      #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.3s linear; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="fade"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
